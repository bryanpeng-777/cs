name: cs_ui
description: cs_framework 配套视觉主题系统。基于 shadcn_ui 提供多套可切换主题，新 App 引入后开箱即用。
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  shadcn_ui: '>=0.26.5 <1.0.0'
  flutter_localizations:
    sdk: flutter
  cs_core:
    path: ../cs_core
  cs_auth:
    path: ../cs_auth
  cached_network_image: ^3.0.0
  lottie: ^3.0.0
  video_player: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
