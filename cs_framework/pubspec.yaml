name: cs_framework
description: CS 框架伞包 - re-export 所有子模块，向后兼容旧版引用。新项目建议按需引入独立子包。
version: 2.0.0
homepage: https://github.com/bryanpeng-777/cs

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # 核心子包（按需按依赖顺序排列）
  cs_core:
    path: ../cs_core
  cs_auth:
    path: ../cs_auth
  cs_push:
    path: ../cs_push
  cs_payment:
    path: ../cs_payment
  cs_ads:
    path: ../cs_ads
  # 以下为传递依赖（让老版本 pubspec 不改变时仍能用）
  supabase_flutter: ^2.0.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  device_info_plus: ^10.0.0
  package_info_plus: ^8.0.0
  uuid: ^4.0.0
  purchases_flutter: ^8.0.0
  google_mobile_ads: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/default_configs.json
